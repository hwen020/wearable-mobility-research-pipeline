name: Verify
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: echo 'f040d7bb224d56bcc6e5e5a2369392c915a282d9448003f43b2958d04234e679  data/synthetic_wearable.csv' | sha256sum --check
      - run: python -m pip check
      - run: python -m compileall -q app migrations
      - run: node --check static/app.js
      - run: sh -n docker-entrypoint.sh
      - run: python -m playwright install --with-deps chromium
      - name: Run API, public read-only and browser regression tests
        run: python -m pytest -q
      - run: docker build --tag wearable-mobility-research-pipeline:1.0.0 .
      - name: Smoke test the release image
        shell: bash
        run: |
          container=$(docker run -d --cpus=0.1 --memory=512m --memory-swap=512m -e PORT=10000 -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e DEMO_PUBLIC_READONLY=true wearable-mobility-research-pipeline:1.0.0)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          docker exec -i "$container" python - http://127.0.0.1:10000 --public < scripts/smoke_release.py
